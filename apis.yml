  detail: >-
    GNC is a physical-goods supplement retailer with no developer surface of any kind — api.gnc.com
    and developer.gnc.com do not resolve, none of the 3,819 URLs in its own sitemap is a developer
    or API page, and every /.well-known/ path plus /apis.json, /openapi.json and /llms.txt returns
    404 on www.gnc.com, stores.gnc.com and gncfranchising.com; its storefront runs on Salesforce
    Commerce Cloud and its store locator on Yext, but neither vendor contract is published by GNC.
