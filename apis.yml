aid: gnc-holdings
name: GNC Holdings
description: >-
  GNC Holdings, LLC (General Nutrition Centers) is an American specialty
  retailer of health, wellness, and performance products including vitamins,
  minerals, herbal supplements, sports nutrition, diet, and energy products.
  Founded in 1935 and headquartered in Pittsburgh, Pennsylvania, GNC is a
  wholly owned subsidiary of Harbin Pharmaceutical Group following its 2020
  acquisition. The company operates owned and franchised retail locations,
  online stores, and retail partnerships across approximately 50 countries.
